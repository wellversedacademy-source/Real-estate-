M({
  id: 12,
  title: "Real Estate Financing: Principles and Practice",
  summary: "How mortgage loans work: notes and security instruments, loan terms and clauses, conventional and government loans, the secondary market, foreclosure, and federal consumer protection laws.",
  objectives: [
    "Explain the roles of the promissory note and the security instrument, including Georgia's security deed.",
    "Calculate points and describe amortized, adjustable-rate and balloon loans.",
    "Compare conventional, FHA, VA and USDA loans.",
    "Describe the primary and secondary mortgage markets and the Federal Reserve's role.",
    "Explain foreclosure and the main consumer protection laws (TILA/TRID, RESPA, ECOA)."
  ],
  sections: [
    ["The note and the security instrument", `<p>Every mortgage loan involves two documents:</p>
<ul>
<li>The [[promissory note]] is the borrower's personal promise to repay the debt. It states the amount, interest rate, payment schedule and term. It is the evidence of the debt.</li>
<li>The <strong>security instrument</strong> pledges the property as collateral. If the borrower defaults, the lender can sell the property. Pledging property without giving up possession is called <strong>hypothecation</strong>.</li>
</ul>
<p>The security instrument takes different forms by state:</p>
<ul>
<li>A [[mortgage]]: the borrower is the <strong>mortgagor</strong> and the lender is the <strong>mortgagee</strong>. (Remember: the lender receives the mortgage, the borrower gives it.)</li>
<li>A <strong>deed of trust</strong>: the borrower (trustor) conveys title to a neutral third party (trustee) for the benefit of the lender (beneficiary).</li>
<li>Georgia uses a [[security deed]] (deed to secure debt). The borrower conveys title to the lender as security, with a power of sale. When the loan is paid off, the lender cancels the security deed.</li>
</ul>
<p><strong>Lien theory</strong> states treat the mortgage as a lien while the borrower keeps title. <strong>Title theory</strong> states, including Georgia, treat the lender as holding title until the debt is repaid.</p>`],
    ["Interest, points and payment plans", `<ul>
<li><strong>Interest</strong> is the cost of borrowing. Charging more than the legal maximum is <strong>usury</strong>.</li>
<li>One [[discount point]] equals <strong>1% of the loan amount</strong>, not the price. Points are prepaid interest that buy a lower rate. On a $200,000 loan, 2 points = $4,000.</li>
<li>The [[annual percentage rate]] (APR) shows the total yearly cost of credit, including interest, points and certain fees. It is usually higher than the note rate.</li>
<li>An [[amortized loan]] has level payments that cover interest and principal so the loan is fully paid at the end of the term. Early payments are mostly interest.</li>
<li>An [[adjustable-rate mortgage]] (ARM) rate equals an <strong>index</strong> (which moves with the market) plus a <strong>margin</strong> (the lender's fixed markup). <strong>Caps</strong> limit how much the rate can change per adjustment and over the loan's life.</li>
<li>A <strong>balloon</strong> loan has small payments and a large lump-sum payment at the end. An interest-only loan pays no principal for a period.</li>
<li>A <strong>reverse mortgage</strong> lets homeowners 62 or older borrow against their equity without monthly payments; the loan is repaid when they sell, move out or die.</li>
</ul>`],
    ["Important loan clauses", `<ul>
<li>[[Acceleration clause]]: lets the lender declare the entire balance due immediately if the borrower defaults.</li>
<li>[[Alienation clause]] (due-on-sale clause): requires the loan to be paid off if the property is sold, preventing a buyer from simply taking over the loan.</li>
<li><strong>Defeasance clause</strong>: requires the lender to release the lien when the loan is paid in full.</li>
<li><strong>Prepayment penalty</strong>: a fee for paying the loan off early. Restricted on many residential loans today.</li>
</ul>
<p>A buyer who <strong>assumes</strong> a loan becomes personally liable for it; the original borrower stays liable unless the lender grants a <strong>release</strong> (novation). A buyer who takes title <strong>subject to</strong> the existing loan is not personally liable, but the property can still be lost to foreclosure.</p>`],
    ["Types of loans", `<div class="tbl-wrap"><table>
<tr><th>Loan</th><th>Key facts</th></tr>
<tr><td>[[Conventional loan]]</td><td>Not insured or guaranteed by the government. Loans meeting Fannie Mae and Freddie Mac standards are “conforming.” Down payments can be as low as 3%, but private mortgage insurance (PMI) is required above 80% LTV. PMI can be canceled at the borrower's request at 80% LTV and ends automatically at 78% under the Homeowners Protection Act.</td></tr>
<tr><td>[[FHA loan]]</td><td>Insured by the Federal Housing Administration (part of HUD). Minimum down payment 3.5% for qualified borrowers. Requires mortgage insurance premiums (upfront and monthly). The property must meet FHA standards and loan limits apply.</td></tr>
<tr><td>[[VA loan]]</td><td>Guaranteed by the Department of Veterans Affairs for eligible veterans, service members and some surviving spouses. No down payment is required in many cases and no monthly mortgage insurance. A funding fee usually applies. The veteran needs a Certificate of Eligibility.</td></tr>
<tr><td>USDA loan</td><td>Backed by the U.S. Department of Agriculture for eligible rural and suburban buyers with income limits; often no down payment.</td></tr>
</table></div>
<p>Other financing tools: a <strong>purchase-money mortgage</strong> (seller financing); a <strong>blanket mortgage</strong> covering several parcels, often with a partial release clause; a <strong>package mortgage</strong> that includes personal property like appliances; an <strong>open-end mortgage</strong> that lets the borrower draw more later; a <strong>construction loan</strong> paid out in draws; a <strong>wraparound loan</strong> that wraps a new loan around an existing one; a <strong>sale-leaseback</strong>; and a <strong>home equity loan or line of credit</strong>.</p>`],
    ["The mortgage market and underwriting", `<p>The <strong>primary mortgage market</strong> is where borrowers get loans: banks, credit unions and mortgage companies. The [[secondary mortgage market]] buys those loans from lenders so lenders get cash to make new loans. Its main players:</p>
<ul>
<li><strong>Fannie Mae</strong> (Federal National Mortgage Association) and <strong>Freddie Mac</strong> (Federal Home Loan Mortgage Corporation) buy conventional loans and package them into securities.</li>
<li><strong>Ginnie Mae</strong> (Government National Mortgage Association) guarantees securities backed by FHA and VA loans.</li>
</ul>
<p>The <strong>Federal Reserve</strong> influences interest rates and the money supply through monetary policy, such as setting the discount rate and federal funds target and buying or selling government securities.</p>
<p>Lenders <strong>underwrite</strong> a loan by evaluating the borrower's credit, income and assets and the property's value. A common measure is the [[debt-to-income ratio]]: monthly housing expense divided by gross monthly income (front-end), and total monthly debts divided by gross monthly income (back-end). The [[loan-to-value ratio]] compares the loan to the lower of the price or appraised value.</p>`],
    ["Default and foreclosure", `<p>[[Foreclosure]] is the legal process of selling a property to pay a defaulted loan.</p>
<ul>
<li><strong>Judicial foreclosure</strong> is handled through a court lawsuit.</li>
<li><strong>Nonjudicial foreclosure</strong> uses a power-of-sale clause and does not require a lawsuit. <strong>Georgia uses nonjudicial foreclosure.</strong> The sale is advertised once a week for four weeks in the county legal newspaper, the borrower must receive written notice at least 30 days before the sale, and sales are held on the first Tuesday of the month at the county courthouse.</li>
</ul>
<p>Before a sale, borrowers usually have an <strong>equitable right of redemption</strong>: they can stop the foreclosure by paying the full debt and costs. Some states also give a <strong>statutory right of redemption</strong> after the sale; Georgia generally does not for mortgage foreclosures.</p>
<p>Alternatives include a <strong>deed in lieu of foreclosure</strong> (the borrower voluntarily deeds the property to the lender) and a [[short sale]] (the lender agrees to accept less than what is owed). If the sale brings less than the debt, the lender may seek a <strong>deficiency judgment</strong> where state law allows. In Georgia, a lender must have the foreclosure sale confirmed by a court to pursue a deficiency.</p>`],
    ["Consumer protection laws", `<ul>
<li>The <strong>Truth in Lending Act</strong> (TILA, implemented by Regulation Z) requires disclosure of credit costs, including the APR. In advertising, a <strong>trigger term</strong> (such as the down payment, number of payments, payment amount or finance charge) requires full disclosure of terms. TILA gives a three-day right of rescission on some refinances of a primary home, but not on a purchase loan.</li>
<li>The TILA-RESPA Integrated Disclosure rule ([[TRID]]) requires a <strong>Loan Estimate</strong> within 3 business days of a loan application and a <strong>Closing Disclosure</strong> at least 3 business days before closing.</li>
<li>The <strong>Equal Credit Opportunity Act</strong> (ECOA) bans credit discrimination based on race, color, religion, national origin, sex, marital status, age (if old enough to contract) or receipt of public assistance.</li>
<li>The <strong>Real Estate Settlement Procedures Act</strong> (RESPA) bans kickbacks and unearned referral fees and limits escrow account cushions (covered in Module 17).</li>
<li>The Dodd-Frank Act requires lenders to verify a borrower's <strong>ability to repay</strong> and created the Consumer Financial Protection Bureau (CFPB).</li>
</ul>`]
  ],
  terms: [
    ["Promissory note", "The borrower's written promise to repay a debt; the evidence of the debt."],
    ["Mortgage", "A security instrument pledging property as collateral; the borrower is the mortgagor and the lender is the mortgagee."],
    ["Security deed", "Georgia's security instrument (deed to secure debt), conveying title to the lender as security with a power of sale."],
    ["Discount point", "A fee equal to 1% of the loan amount, paid to lower the interest rate."],
    ["Annual percentage rate", "The yearly cost of credit including interest and certain fees, expressed as a percentage."],
    ["Amortized loan", "A loan repaid with level payments of principal and interest over its term."],
    ["Adjustable-rate mortgage", "A loan whose rate changes based on an index plus a margin, subject to caps."],
    ["Acceleration clause", "A clause allowing the lender to demand the full balance upon default."],
    ["Alienation clause", "A due-on-sale clause requiring the loan to be paid when the property is sold."],
    ["Conventional loan", "A loan not insured or guaranteed by a government agency."],
    ["FHA loan", "A loan insured by the Federal Housing Administration, with low down payment requirements."],
    ["VA loan", "A loan guaranteed by the Department of Veterans Affairs for eligible veterans and service members."],
    ["Secondary mortgage market", "The market where existing loans are bought and sold, including Fannie Mae, Freddie Mac and Ginnie Mae."],
    ["Debt-to-income ratio", "A borrower's monthly debt payments divided by gross monthly income."],
    ["Loan-to-value ratio", "The loan amount divided by the lesser of the sale price or appraised value."],
    ["Foreclosure", "The legal process of selling property to satisfy a defaulted debt."],
    ["Short sale", "A sale in which the lender agrees to accept less than the loan balance."],
    ["TRID", "The TILA-RESPA Integrated Disclosure rule requiring the Loan Estimate and Closing Disclosure."]
  ],
  scenarios: [
    ["Comparing two loan offers", "Priya is borrowing $320,000. Lender A offers 6.75% with no points. Lender B offers 6.25% with 2 points. Two points cost 2% × $320,000 = $6,400 at closing. The lower rate saves about $105 a month in principal and interest, so Priya would recover the points in about 61 months (5 years). If she expects to sell or refinance sooner, Lender A is likely the better deal. A licensee should not give financial advice beyond their expertise, but can help a client understand how points work and encourage them to compare Loan Estimates."]
  ],
  traps: [
    "Points are based on the <strong>loan amount</strong>, never the sale price.",
    "The borrower is the mortgagor (gives the mortgage); the lender is the mortgagee (receives it).",
    "Fannie Mae and Freddie Mac <em>buy</em> loans; FHA <em>insures</em> loans; VA <em>guarantees</em> loans. None of them make loans directly to most borrowers.",
    "The TILA right of rescission does not apply to a loan used to buy a home.",
    "Georgia is a title-theory state that uses security deeds and nonjudicial foreclosure."
  ],
  quiz: [
    ["Which document is the evidence of the debt?", ["Security deed", "Promissory note", "Deed of trust", "Mortgage"], 1, "The [[promissory note]] is the promise to pay; the security instrument pledges the property."],
    ["In a mortgage, the borrower is the:", ["Mortgagee", "Mortgagor", "Beneficiary", "Trustee"], 1, "The borrower gives the mortgage and is the mortgagor."],
    ["Georgia's standard security instrument is the:", ["Mortgage", "Deed of trust", "Security deed (deed to secure debt)", "Land contract"], 2, "Georgia uses a [[security deed]] that conveys title to the lender as security."],
    ["A lender charges 2 points on a $250,000 loan for a $300,000 home. The points cost:", ["$6,000", "$5,000", "$600", "$500"], 1, "Points use the loan amount: 2% × $250,000 = $5,000."],
    ["The clause that lets a lender demand the full balance if the borrower defaults is the:", ["Defeasance clause", "Alienation clause", "Acceleration clause", "Prepayment clause"], 2, "The [[acceleration clause]] makes the whole debt due on default."],
    ["The rate on an adjustable-rate mortgage is calculated as:", ["Index plus margin", "Margin minus index", "Prime rate only", "APR plus points"], 0, "An ARM rate equals the index plus the lender's margin, limited by caps."],
    ["Which loan is guaranteed (not insured) by a federal agency and may require no down payment?", ["FHA", "VA", "Conventional", "Conforming"], 1, "[[VA loan|VA loans]] are guaranteed by the Department of Veterans Affairs."],
    ["Fannie Mae and Freddie Mac operate mainly in the:", ["Primary mortgage market", "Secondary mortgage market", "Commercial paper market", "Stock market only"], 1, "They buy loans from lenders in the [[secondary mortgage market]]."],
    ["Under TRID, the Closing Disclosure must be received at least how long before closing?", ["1 business day", "3 business days", "7 days", "30 days"], 1, "The Closing Disclosure must be received at least 3 business days before consummation."],
    ["Georgia mortgage foreclosures are generally:", ["Judicial, held any weekday", "Nonjudicial, with sales on the first Tuesday of the month", "Strict foreclosure with no sale", "Handled only by HUD"], 1, "Georgia uses nonjudicial power-of-sale foreclosure, with sales on the first Tuesday of the month."]
  ]
});

M({
  id: 13,
  title: "Appraisal and Valuation",
  summary: "What value is, the economic principles behind it, and the three approaches appraisers use: sales comparison, cost and income.",
  objectives: [
    "Distinguish an appraisal from a comparative market analysis, and value from price and cost.",
    "List the four characteristics of value and key valuation principles.",
    "Make sales comparison adjustments in the correct direction.",
    "Apply the cost approach, including the three types of depreciation.",
    "Apply the income approach using NOI, cap rates and gross rent multipliers."
  ],
  sections: [
    ["What an appraisal is", `<p>An [[appraisal]] is an unbiased, supported opinion of value for a specific property as of a specific date. Appraisals for most federally related loans must be done by a state-licensed or certified appraiser following the <strong>Uniform Standards of Professional Appraisal Practice</strong> (USPAP). The appraiser's fee cannot depend on the value reached.</p>
<p>A licensee may prepare a comparative market analysis or a broker price opinion to help a client, but must not represent it as an appraisal.</p>`],
    ["Value, price and cost", `<p>[[Market value]] is the most probable price a property would bring in a competitive, open market, with a willing buyer and seller who are both informed, neither under pressure, and a reasonable time on the market. <strong>Market price</strong> is what a property actually sold for. <strong>Cost</strong> is what it would take to build. The three can be very different.</p>
<p>For anything to have value, it needs four characteristics, remembered as <strong>DUST</strong>: <strong>D</strong>emand (with buying power), <strong>U</strong>tility (usefulness), <strong>S</strong>carcity and <strong>T</strong>ransferability.</p>`],
    ["Principles of value", `<ul>
<li>[[Highest and best use]]: the legally permitted, physically possible, financially feasible use that produces the highest value. It is the starting point for every appraisal.</li>
<li>[[Substitution]]: a buyer will not pay more for a property than the cost of an equally desirable substitute. This is the basis of the sales comparison approach.</li>
<li><strong>Conformity</strong>: value is maximized when a property is similar to its neighbors.</li>
<li><strong>Regression</strong>: the best house in a lower-priced neighborhood is pulled down in value. <strong>Progression</strong>: a modest house in a better neighborhood is pulled up.</li>
<li>[[Contribution]]: an improvement is worth only what it adds to market value, not what it cost. A $60,000 pool may add $20,000.</li>
<li><strong>Anticipation</strong>: value is the present worth of expected future benefits. This underlies the income approach.</li>
<li><strong>Change</strong>: neighborhoods go through growth, stability, decline and revitalization.</li>
<li><strong>Plottage</strong>: combining adjacent parcels (assemblage) can create value greater than the parts.</li>
</ul>`],
    ["Sales comparison approach", `<p>The [[sales comparison approach]] (market data approach) estimates value from recent sales of similar properties, called <strong>comparables</strong> or comps. It is the most reliable approach for homes and vacant land.</p>
<p>The appraiser adjusts each comp's sale price to make it like the <strong>subject</strong> property. The golden rule: <strong>always adjust the comparable, never the subject.</strong></p>
<ul>
<li>If the comp is <strong>better</strong> than the subject, <strong>subtract</strong> the value of the difference from the comp's price (CBS: Comp Better, Subtract).</li>
<li>If the comp is <strong>worse</strong>, <strong>add</strong> (CPA: Comp Poorer, Add).</li>
</ul>
<p><strong>Example:</strong> A comp sold for $310,000 and has a garage worth $15,000; the subject has no garage. Adjusted comp price: $310,000 − $15,000 = $295,000.</p>`],
    ["Cost approach", `<p>The [[cost approach]] is best for new buildings and special-purpose properties (schools, churches) that rarely sell. The formula:</p>
<p><strong>Value = Cost new of the building − Depreciation + Land value</strong></p>
<p>Cost new may be <strong>reproduction cost</strong> (an exact replica with the same materials) or <strong>replacement cost</strong> (a building with the same function using modern materials). Land is valued separately by sales comparison because land does not depreciate.</p>
<p>Appraisal [[depreciation]] is any loss in value, from three sources:</p>
<ul>
<li><strong>Physical deterioration</strong>: wear and tear, such as a worn roof. Curable if fixing it is economically worthwhile.</li>
<li>[[Functional obsolescence]]: outdated design or features inside the property, such as one bathroom in a five-bedroom house. May be curable or incurable.</li>
<li>[[External obsolescence]]: loss caused by factors outside the property, such as a new landfill or highway noise. It is always <strong>incurable</strong> because the owner cannot fix it.</li>
</ul>
<p>The simplest depreciation method is <strong>straight-line</strong> (age-life): cost ÷ economic life = annual depreciation.</p>`],
    ["Income approach", `<p>The [[income approach]] is used for income-producing property such as apartments and offices. It is based on the principle of anticipation.</p>
<ol>
<li>Estimate <strong>potential gross income</strong> (full rent at 100% occupancy).</li>
<li>Subtract vacancy and collection losses to get <strong>effective gross income</strong>.</li>
<li>Subtract operating expenses to get [[net operating income]] (NOI). Mortgage payments and depreciation are <em>not</em> operating expenses.</li>
<li>Divide NOI by a [[capitalization rate]]: <strong>Value = NOI ÷ Cap rate</strong>.</li>
</ol>
<p>Remember <strong>IRV</strong>: Income = Rate × Value. A higher cap rate means a lower value (and higher risk).</p>
<p>For single-family rentals, appraisers may use a [[gross rent multiplier]]: <strong>Value = Monthly rent × GRM</strong>. For commercial property, a gross income multiplier uses annual income.</p>`],
    ["Reconciliation", `<p>After applying the relevant approaches, the appraiser <strong>reconciles</strong> them into one final value by giving the most weight to the approach that best fits the property type and the quality of the data. Reconciliation is not a simple average.</p>`]
  ],
  terms: [
    ["Appraisal", "An unbiased, supported opinion of value of a specific property as of a specific date."],
    ["Market value", "The most probable price a property would bring in an open, competitive market under normal conditions."],
    ["Highest and best use", "The legal, possible, feasible use that produces the highest value."],
    ["Substitution", "The principle that buyers will not pay more than the cost of an equally desirable substitute."],
    ["Contribution", "The principle that an improvement is worth what it adds to value, not what it cost."],
    ["Sales comparison approach", "Estimating value by adjusting the sale prices of similar properties."],
    ["Cost approach", "Value = cost new of improvements minus depreciation, plus land value."],
    ["Functional obsolescence", "Loss in value from outdated design or features within the property."],
    ["External obsolescence", "Loss in value from factors outside the property; always incurable."],
    ["Income approach", "Estimating value by capitalizing a property's net operating income."],
    ["Net operating income", "Effective gross income minus operating expenses (excluding debt service)."],
    ["Capitalization rate", "The rate of return used to convert NOI into value: Value = NOI ÷ Rate."],
    ["Gross rent multiplier", "A factor that estimates value from monthly rent for single-family rentals."]
  ],
  scenarios: [
    ["Adjusting a comparable", "The subject home has 3 bedrooms, 2 baths and no fireplace. A comp sold for $285,000 with 3 bedrooms, 2.5 baths and a fireplace. The market shows a half bath is worth $6,000 and a fireplace $3,000. The comp is better in both features, so subtract: $285,000 − $6,000 − $3,000 = $276,000 indicated value for the subject from this comp."]
  ],
  traps: [
    "Adjust the comparable, never the subject. Comp better: subtract. Comp poorer: add.",
    "External obsolescence is always incurable.",
    "A higher cap rate produces a <em>lower</em> value from the same income.",
    "Mortgage payments are not operating expenses when calculating NOI.",
    "Land is not depreciated in the cost approach; it is valued separately and added back."
  ],
  quiz: [
    ["The four characteristics of value are:", ["Demand, utility, scarcity and transferability", "Desire, use, size and title", "Demand, usury, supply and taxes", "Durability, utility, style and terrain"], 0, "Remember DUST: demand, utility, scarcity, transferability."],
    ["The principle that a buyer will not pay more than the cost of an equally good alternative is:", ["Conformity", "Substitution", "Contribution", "Anticipation"], 1, "[[Substitution]] is the foundation of the sales comparison approach."],

  sections: [
    ["Leasehold estates", `<p>A [[lease]] is a contract that transfers the right of possession from the owner, the [[lessor]] (landlord), to the [[lessee]] (tenant), in exchange for rent. The landlord keeps a <strong>reversionary interest</strong>: possession returns when the lease ends.</p>
<ul>
<li>An [[estate for years]] lasts for a definite period with a set end date (even six months). It ends automatically; no notice is needed.</li>
<li>A [[periodic tenancy]] (estate from period to period) renews automatically, such as month-to-month, until one party gives proper notice.</li>
<li>A <strong>tenancy at will</strong> has no set term and lasts as long as both parties wish. It ends with notice or the death of either party. In Georgia, a landlord generally must give 60 days' notice and a tenant 30 days' notice to end a tenancy at will.</li>
<li>A <strong>tenancy at sufferance</strong> arises when a tenant stays after the lease ends without permission (a holdover). If the landlord accepts rent, a periodic tenancy may be created.</li>
</ul>`],

<ul>
<li>In an [[assignment]], the tenant transfers the <em>entire</em> remaining lease to a new tenant, who pays the landlord directly. The original tenant usually stays secondarily liable unless released.</li>
<li>In a [[sublease]], the tenant transfers only part of the term or space and remains the new occupant's landlord. The original tenant stays primarily liable to the landlord. (This creates a “sandwich lease.”)</li>
</ul>
<p>A sale of the property does not end a lease. The new owner takes title subject to existing leases. The death of the landlord or tenant usually does not end an estate for years.</p>`],

<li>[[Net lease]]: the tenant pays rent plus some or all of the operating expenses. In a <strong>triple net</strong> (NNN) lease, the tenant pays taxes, insurance and maintenance. Common for commercial property.</li>
<li>[[Percentage lease]]: the tenant pays base rent plus a percentage of gross sales above a set amount. Common in shopping centers. Example: $3,000 a month plus 5% of annual sales over $500,000.</li>
<li><strong>Graduated lease</strong>: rent steps up at set intervals. <strong>Index lease</strong>: rent changes with an index such as the consumer price index.</li>
<li><strong>Ground lease</strong>: a long-term lease of land only, on which the tenant builds. Often 50 to 99 years.</li>

    ["Rights, deposits and evictions", `<p>Tenants have the right of <strong>quiet enjoyment</strong>: the landlord will not interfere with possession. Most states, including Georgia, require landlords to keep residential premises in repair and fit to live in.</p>
<p>A [[security deposit]] protects the landlord against unpaid rent and damage beyond normal wear and tear. In Georgia, the landlord must return the deposit, or provide a written list of deductions, within 30 days after the tenant moves out, and landlords with more than 10 units (or who use a management company) must follow additional escrow and move-in inspection rules.</p>
<p>Ending a lease: expiration of the term, mutual agreement (surrender), breach, destruction of the premises, or condemnation.</p>

<li>[[Constructive eviction]] happens when the landlord's failure to maintain the property (for example, no heat in winter) makes it unusable. The tenant may move out and stop paying rent, but must actually leave.</li>
<li><strong>Retaliatory eviction</strong>, evicting a tenant for reporting code violations or joining a tenant group, is prohibited.</li>
</ul>`],
    ["The property manager", `<p>A [[property manager]] runs income property for an owner to protect the investment and maximize net income. In Georgia, managing property for others for a fee generally requires a real estate license and must be done through a brokerage.</p>
<p>The [[management agreement]] creates a <strong>general agency</strong>: the manager handles a range of ongoing tasks. It should state the property, term, the manager's authority, reporting requirements, fees (often a percentage of collected rents), and who pays which expenses.</p>
<p>Main duties:</p>
<ul>
<li><strong>Budgeting</strong>: an operating budget for the year and a capital reserve budget for major replacements like roofs.</li>
<li><strong>Setting rents</strong> based on market surveys. High vacancy suggests rents are too high; no vacancy and a waiting list suggests they may be too low.</li>

function rich(s) {
  // [[Term]] or [[Glossary Term|text shown]]
  return s.replace(/\[\[([^\]|]+)(?:\|([^\]]+))?\]\]/g, (_, key, shownText) => {
    const shown = shownText || key;

}

/* ---------- Saved progress (browser storage) ---------- */
const KEY = 'licensePath.v1';
const fresh = () => ({ mods: {}, hist: {}, missed: {}, last: null, exams: [], plan: { date: '', hours: 8 }, theme: null, run: null });
let S = fresh();
try { const raw = JSON.parse(localStorage.getItem(KEY)); if (raw && typeof raw === 'object') S = Object.assign(fresh(), raw); } catch (e) { /* storage unavailable */ }
function save() { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) { /* storage unavailable */ } }
const mp = id => (S.mods[id] = S.mods[id] || { visited: false, read: false, best: null, attempts: 0, known: [] });

function status(id) {
  const m = S.mods[id];
  if (m && m.best !== null && m.best >= PASS && m.read) return 'done';
  if (m && m.visited) return 'ip';
  return 'ns';
}
const STATUS_LABEL = { ns: 'Not started', ip: 'In progress', done: 'Completed' };
const pill = st => `<span class="pill ${st}">${STATUS_LABEL[st]}</span>`;

function record(modId, qi, ok) {
  const h = (S.hist[modId] = S.hist[modId] || []);
  h.push(ok ? 1 : 0); if (h.length > 40) h.shift();
  const k = modId + ':' + qi;
  if (!ok) S.missed[k] = (S.missed[k] || 0) + 1;
}
function accuracy(modId) { const h = S.hist[modId]; if (!h || !h.length) return null; return Math.round(100 * h.reduce((a, b) => a + b, 0) / h.length); }
function completedCount() { return MODULES.filter(m => status(m.id) === 'done').length; }
function avgQuiz() { const b = MODULES.map(m => S.mods[m.id] && S.mods[m.id].best).filter(v => v !== null && v !== undefined); return b.length ? Math.round(b.reduce((a, c) => a + c, 0) / b.length) : null; }

function recommendations(limit = 5) {
  const rows = MODULES.map(m => ({ m, acc: accuracy(m.id), n: (S.hist[m.id] || []).length, st: status(m.id) }));
  const weak = rows.filter(r => r.acc !== null && r.n >= 3 && r.acc < 80).sort((a, b) => a.acc - b.acc);
  const untouched = rows.filter(r => r.acc === null && r.st !== 'done');
  return { weak: weak.slice(0, limit), untouched, rows };
}

/* Flashcards */
let fc = null;
function renderCards() {
  const m = MOD(curMod); const p = mp(curMod);
  if (!fc || fc.mod !== curMod) fc = { mod: curMod, order: m.terms.map((_, i) => i), i: 0, flipped: false, onlyNew: false };
  let order = fc.order; if (fc.onlyNew) order = order.filter(i => !p.known.includes(m.terms[i][0]));
  const body = $('#tabBody');
  const known = p.known.filter(k => m.terms.some(t => t[0] === k)).length;
  if (!order.length) {
    body.innerHTML = `<div class="card empty stack" style="align-items:center"><h3>You know every card in this deck</h3><p>Turn off “Only cards I'm still learning” to review the full deck.</p><button class="btn" data-act="fcnew">Show all cards</button></div>`;
    return;
  }
  if (fc.i >= order.length) fc.i = 0;
  const [t, d] = m.terms[order[fc.i]];
  body.innerHTML = `<div class="fc-wrap">
    <div class="row" style="justify-content:space-between;width:100%;max-width:560px">
      <span class="muted mono">Card ${fc.i + 1} / ${order.length}</span><span class="muted">${known} of ${m.terms.length} marked known</span>
    </div>
    <button class="fc ${fc.flipped ? 'flipped' : ''}" data-act="flip" aria-label="Flashcard. ${fc.flipped ? 'Showing definition' : 'Showing term'}. Tap to flip.">
      <div class="fc-inner">
        <div class="fc-face fc-front"><span class="eyebrow">Term</span><span class="fc-term">${esc(t)}</span><span class="fc-hint">Tap or press Space to flip</span></div>
        <div class="fc-face fc-back"><span class="eyebrow">${esc(t)}</span><span class="fc-def">${esc(d)}</span></div>
      </div>
    </button>
    <div class="fc-controls">
      <button class="btn" data-act="fcprev">← Back</button>
      <button class="btn" data-act="fcagain">Still learning</button>
      <button class="btn primary" data-act="fcknow">I know it</button>
    </div>
    <div class="fc-controls">
      <button class="btn small ghost" data-act="fcshuffle">Shuffle deck</button>
      <button class="btn small ghost" data-act="fcnew" aria-pressed="${fc.onlyNew}">${fc.onlyNew ? 'Show all cards' : "Only cards I'm still learning"}</button>
    </div>
  </div>`;
}
function fcAdvance(markKnown) {
  const m = MOD(curMod); const p = mp(curMod);
  let order = fc.order; if (fc.onlyNew) order = order.filter(i => !p.known.includes(m.terms[i][0]));
  const term = m.terms[order[fc.i]][0];
  if (markKnown === true && !p.known.includes(term)) p.known.push(term);
  if (markKnown === false) p.known = p.known.filter(k => k !== term);
  save();
  fc.flipped = false;
  if (fc.onlyNew && markKnown === true) { /* the card leaves the filtered list, same index shows the next card */ }
  else fc.i = (fc.i + 1) % order.length;
  renderCards();
}

/* Module quiz */
let quiz = null;
function newQuiz(m) { return { mod: m.id, i: 0, picks: [], opt: m.quiz.map(q => shuffle(q[1].map((_, k) => k))), done: false }; }
function renderQuiz() {
  const m = MOD(curMod); const body = $('#tabBody');
  if (!quiz || quiz.mod !== curMod) quiz = newQuiz(m);
  if (quiz.done) return renderQuizResult(m);
  const q = m.quiz[quiz.i]; const pick = quiz.picks[quiz.i];
  const answered = pick !== undefined;
  const correctSoFar = quiz.picks.filter((p, k) => p === m.quiz[k][2]).length;
  const opts = quiz.opt[quiz.i].map((k, n) => {
    let cls = '';
    if (answered) { if (k === q[2]) cls = 'correct'; else if (k === pick) cls = 'wrong'; }
    return `<button class="opt ${cls}" data-act="qpick" data-k="${k}" ${answered ? 'disabled' : ''}><span class="opt-letter">${'ABCD'[n]}</span><span>${esc(q[1][k])}</span></button>`;
  }).join('');
  body.innerHTML = `<div class="quiz">
    <div class="q-progress"><span class="mono">Question ${quiz.i + 1} of ${m.quiz.length}</span><span>${correctSoFar} correct so far</span></div>
    <div class="bar" aria-hidden="true"><span style="width:${100 * quiz.i / m.quiz.length}%"></span></div>
    <p class="q-text">${esc(q[0])}</p>
    <div class="opts">${opts}</div>
    ${answered ? `<div class="explain ${pick === q[2] ? '' : 'bad'}" role="status"><strong>${pick === q[2] ? 'Correct.' : 'Not quite. The correct answer is “' + esc(q[1][q[2]]) + '.”'}</strong>${rich(esc(q[3]))}</div>
      <div><button class="btn primary" data-act="qnext">${quiz.i + 1 < m.quiz.length ? 'Next question →' : 'See my score'}</button></div>` : ''}
  </div>`;
}
function renderQuizResult(m) {
  const p = mp(m.id);
  const right = quiz.picks.filter((pk, k) => pk === m.quiz[k][2]).length;
  const pct = Math.round(100 * right / m.quiz.length);
  const passed = pct >= PASS;
  $('#tabBody').innerHTML = `<div class="quiz">
    <div class="card stack" style="gap:10px">
      <div class="eyebrow">Quiz result</div>
      <div class="row" style="gap:16px;align-items:flex-end"><span class="score-big" style="color:var(--${passed ? 'good' : 'bad'})">${pct}%</span><span>${right} of ${m.quiz.length} correct · best ${p.best}%</span></div>
      <p>${passed ? (p.read ? 'Nice work. This module is now marked completed.' : `You passed. Mark the lesson as finished to complete this module.`) : `You need ${PASS}% to complete this module. Review the explanations below, revisit the lesson, and try again.`}</p>
      <div class="row">
        <button class="btn primary" data-act="qretry">Retake quiz</button>
        ${!p.read ? '<button class="btn" data-act="markread">Mark lesson as finished</button>' : ''}
        ${MOD(m.id + 1) ? `<a class="btn" href="#module-${m.id + 1}">Next module →</a>` : ''}
      </div>
    </div>
    <h3>Review your answers</h3>
    ${m.quiz.map((q, k) => {
      const ok = quiz.picks[k] === q[2];
      return `<div class="review-item"><span class="tag ${ok ? 'ok' : 'no'}">${ok ? '✓ Correct' : '✗ Missed'} · Q${k + 1}</span><strong>${esc(q[0])}</strong>
      ${ok ? '' : `<span>Your answer: ${esc(q[1][quiz.picks[k]])}</span>`}<span>Correct answer: <strong>${esc(q[1][q[2]])}</strong></span><span class="muted">${rich(esc(q[3]))}</span></div>`;
    }).join('')}
  </div>`;
}

/* ---------- Glossary ---------- */
let gq = '';
function viewGlossary() {
  setTitle('Glossary');
  $('#view').innerHTML = `<div class="stack" style="gap:20px">
    <div class="stack" style="gap:6px"><h1>Master glossary</h1><p class="muted">Every key term from all ${MODULES.length} modules (${GLOSS.size} terms). Search by word or by anything in a definition.</p></div>
    <div class="search">${icon('search')}<input id="glossSearch" type="search" placeholder="Search terms, e.g. easement, escrow, LTV" aria-label="Search glossary" value="${esc(gq)}"></div>
    <div id="glossList" class="stack" style="gap:22px"></div>
    ${disclaimer()}
  </div>`;
  const inp = $('#glossSearch');
  inp.addEventListener('input', () => { gq = inp.value; renderGloss(); });
  renderGloss();
}
function renderGloss() {
  const q = gq.trim().toLowerCase();
  const all = [...GLOSS.values()].sort((a, b) => a.t.localeCompare(b.t));
  const list = q ? all.filter(g => g.t.toLowerCase().includes(q) || g.d.toLowerCase().includes(q)) : all;
  const groups = {};
  for (const g of list) { const L = /[a-z]/i.test(g.t[0]) ? g.t[0].toUpperCase() : '#'; (groups[L] = groups[L] || []).push(g); }

    : `<div class="empty">No terms match “${esc(gq)}.” Try a shorter word.</div>`;
}

/* ---------- Math calculators ---------- */
const CALCS = [
  {
    id: 'comm', title: 'Commission split',
    intro: 'Total commission is the sale price times the rate. It is usually divided between the listing and selling brokerages, then between each brokerage and its agent.',
    inputs: [['price', 'Sale price ($)', 350000], ['rate', 'Commission rate (%)', 6], ['side', 'Your brokerage’s share of the commission (%)', 50], ['agent', 'Your split with your broker (%)', 60]],
    calc: v => {
      const total = v.price * v.rate / 100, side = total * v.side / 100, agent = side * v.agent / 100;
      return { big: money(agent), label: 'Your take-home commission (before taxes and fees)', steps:
`Total commission  = ${money(v.price, 0)} × ${v.rate}%      = ${money(total)}
Brokerage share   = ${money(total)} × ${v.side}%      = ${money(side)}
Your share        = ${money(side)} × ${v.agent}%      = ${money(agent)}
Broker keeps      = ${money(side)} − ${money(agent)} = ${money(side - agent)}` };
    }
  },
  {
    id: 'ltv', title: 'Loan-to-value (LTV)',
    intro: 'Lenders compare the loan to the property’s value, using the lower of the sale price or the appraised value. Conventional loans above 80% LTV usually require private mortgage insurance (PMI).',
    inputs: [['price', 'Sale price ($)', 300000], ['appr', 'Appraised value ($)', 295000], ['loan', 'Loan amount ($)', 265500]],
    calc: v => {
      const val = Math.min(v.price, v.appr), ltv = val ? 100 * v.loan / val : 0;
      return { big: num(ltv, 2) + '%', label: ltv > 80 ? 'LTV is above 80%: expect PMI on a conventional loan' : 'LTV is 80% or less: PMI usually not required', steps:
`Value used        = lower of ${money(v.price, 0)} and ${money(v.appr, 0)} = ${money(val, 0)}
LTV               = ${money(v.loan, 0)} ÷ ${money(val, 0)} = ${num(ltv, 2)}%
Down payment/equity = ${money(val - v.loan, 0)} (${num(100 - ltv, 2)}% of value)` };
    }
  },
  {
    id: 'pmt', title: 'Monthly mortgage payment',
    intro: 'This is the principal-and-interest payment on a fully amortized fixed-rate loan. Taxes, insurance and PMI (together with P&I, called PITI) are added on top.',
    inputs: [['loan', 'Loan amount ($)', 240000], ['rate', 'Annual interest rate (%)', 6.5], ['years', 'Term (years)', 30]],
    calc: v => {
      const r = v.rate / 100 / 12, n = v.years * 12;
      const pmt = r ? v.loan * r * Math.pow(1 + r, n) / (Math.pow(1 + r, n) - 1) : v.loan / n;
      const first = v.loan * r;
      return { big: money(pmt), label: 'Monthly principal & interest', steps:
`Monthly rate r    = ${v.rate}% ÷ 12 = ${num(r * 100, 4)}%
Number of payments n = ${v.years} × 12 = ${n}
Payment = L × r(1+r)^n ÷ ((1+r)^n − 1) = ${money(pmt)}
Month 1 interest  = ${money(v.loan, 0)} × ${num(r * 100, 4)}% = ${money(first)}
Month 1 principal = ${money(pmt)} − ${money(first)} = ${money(pmt - first)}
Total interest over the loan = ${money(pmt * n - v.loan, 0)}` };
    }
  },
  {
    id: 'tax', title: 'Property tax',
    intro: 'Tax = (assessed value − exemptions) × tax rate. Georgia assesses property at 40% of fair market value, and rates are quoted in mills (1 mill = $1 per $1,000, or 0.001).',
    inputs: [['mv', 'Fair market value ($)', 300000], ['ratio', 'Assessment ratio (%)', 40], ['ex', 'Exemptions ($)', 2000], ['mills', 'Tax rate (mills)', 30]],
    calc: v => {
      const av = v.mv * v.ratio / 100, taxable = Math.max(av - v.ex, 0), tax = taxable * v.mills / 1000;
      return { big: money(tax), label: `Annual tax (${money(tax / 12)} per month)`, steps:
`Assessed value  = ${money(v.mv, 0)} × ${v.ratio}% = ${money(av, 0)}
Taxable value   = ${money(av, 0)} − ${money(v.ex, 0)} = ${money(taxable, 0)}
Rate in decimal = ${v.mills} mills ÷ 1,000 = ${num(v.mills / 1000, 4)}
Annual tax      = ${money(taxable, 0)} × ${num(v.mills / 1000, 4)} = ${money(tax)}` };
    }
  },
  {
    id: 'area', title: 'Square footage and price per foot',
    intro: 'Break an L-shaped or irregular floor plan into rectangles, find each area (length × width), and add them. Then you can price by the square foot or convert land to acres.',
    inputs: [['l1', 'Section A length (ft)', 40], ['w1', 'Section A width (ft)', 30], ['l2', 'Section B length (ft)', 20], ['w2', 'Section B width (ft)', 15], ['ppsf', 'Price per sq ft ($)', 180]],
    calc: v => {
      const a = v.l1 * v.w1, b = v.l2 * v.w2, t = a + b;
      return { big: num(t) + ' sq ft', label: `Estimated value at ${money(v.ppsf, 0)}/sq ft: ${money(t * v.ppsf, 0)}`, steps:
`Section A = ${v.l1} × ${v.w1} = ${num(a)} sq ft
Section B = ${v.l2} × ${v.w2} = ${num(b)} sq ft
Total     = ${num(a)} + ${num(b)} = ${num(t)} sq ft
Value     = ${num(t)} × ${money(v.ppsf, 0)} = ${money(t * v.ppsf, 0)}
In acres  = ${num(t)} ÷ 43,560 = ${num(t / 43560, 4)} acres
In sq yd  = ${num(t)} ÷ 9 = ${num(t / 9, 2)} sq yd` };
    }
  },
  {
    id: 'cap', title: 'Capitalization (cap) rate',
    intro: 'Income property is valued with IRV: Income (NOI) = Rate × Value. Net operating income is gross income minus vacancy and operating expenses. Mortgage payments are not operating expenses.',
    inputs: [['gross', 'Potential gross income ($/yr)', 120000], ['vac', 'Vacancy & collection loss (%)', 5], ['exp', 'Operating expenses ($/yr)', 44000], ['price', 'Price or value ($)', 1000000]],
    calc: v => {
      const egi = v.gross * (1 - v.vac / 100), noi = egi - v.exp, cap = v.price ? 100 * noi / v.price : 0;
      return { big: num(cap, 2) + '%', label: `Cap rate (NOI ${money(noi, 0)} per year)`, steps:
`Effective gross   = ${money(v.gross, 0)} × (1 − ${v.vac}%) = ${money(egi, 0)}
NOI               = ${money(egi, 0)} − ${money(v.exp, 0)} = ${money(noi, 0)}
Cap rate (R = I÷V) = ${money(noi, 0)} ÷ ${money(v.price, 0)} = ${num(cap, 2)}%
Value at an 8% cap (V = I÷R) = ${money(noi, 0)} ÷ 0.08 = ${money(noi / 0.08, 0)}` };
    }
  }
];

  const qs = [];
  const per = Math.floor(EXAM_QS / MODULES.length); let extra = EXAM_QS - per * MODULES.length;
  for (const m of shuffle(MODULES)) {
    const take = per + (extra-- > 0 ? 1 : 0);
    shuffle(m.quiz.map((_, i) => i)).slice(0, Math.min(take, m.quiz.length)).forEach(i => qs.push({ m: m.id, i, o: shuffle(m.quiz[i][1].map((_, k) => k)) }));

  if (days < 0) { out.innerHTML = '<div class="notice">That date has passed. Choose a future exam date to build a plan.</div>'; return; }
  const weeks = Math.max(1, Math.ceil(days / 7));
  const hrs = +S.plan.hours;
  const head = `<div class="${example ? 'notice' : 'card'} stack" style="gap:6px">
    ${example ? '<strong>Example schedule for an exam 8 weeks from today. Set your exam date above to make it yours.</strong>' : ''}
    <span><strong>${days}</strong> day${days === 1 ? '' : 's'} until your exam (${target.toLocaleDateString(undefined, { weekday: 'long', month: 'long', day: 'numeric', year: 'numeric' })}) · <strong>${todo.length}</strong> module${todo.length === 1 ? '' : 's'} left · <strong>${hrs}</strong> hours a week</span>
    ${weeks < 3 && todo.length > 6 ? '<span style="color:var(--warn)">This is a tight schedule. Consider more weekly hours or a later exam date.</span>' : ''}
  </div>`;
  if (!todo.length) { out.innerHTML = head + '<div class="card" style="margin-top:12px">All modules are completed. Spend each remaining week taking a full practice exam, then reviewing your weak areas and the math module.</div>'; return; }
  const studyWeeks = weeks >= 2 ? weeks - 1 : 1;
  // Weight math (18) and state (19) modules double because they take longer.
  const weight = m => (m.id === 18 || m.id === 12 ? 2 : 1);
  const totalW = todo.reduce((a, m) => a + weight(m), 0);
  const perWeek = totalW / studyWeeks;
  const plan = Array.from({ length: studyWeeks }, () => []);
  let acc = 0;
  todo.forEach(m => { const w = Math.min(studyWeeks - 1, Math.floor(acc / perWeek)); plan[w].push(m); acc += weight(m); });
  const start = new Date(now);
  const html = plan.map((mods, w) => {
    const ws = new Date(start.getTime() + w * 7 * 864e5), we = new Date(Math.min(ws.getTime() + 6 * 864e5, target.getTime()));
    const mid = w === Math.floor(studyWeeks / 2) && studyWeeks > 2;
    return `<div class="week"><div class="week-label"><strong>Week ${w + 1}</strong>${ws.toLocaleDateString(undefined, { month: 'short', day: 'numeric' })} – ${we.toLocaleDateString(undefined, { month: 'short', day: 'numeric' })}</div>
      <div>${mods.length ? `<div>${mods.map(m => `<a href="#module-${m.id}">Module ${pad2(m.id)}: ${esc(m.title)}</a>`).join('<br>')}</div>
      <ul class="muted" style="font-size:.9rem"><li>About ${Math.round(hrs / Math.max(mods.length, 1) * 10) / 10} hours per module: read the lesson, study the flashcards, pass the quiz with ${PASS}%+.</li>${mid ? '<li>Midpoint check: take one full practice exam this weekend.</li>' : ''}${mods.some(m => m.id === 18) ? '<li>Math week: work every calculator example by hand before checking it.</li>' : ''}</ul>`
      : '<span class="muted">Catch-up week: retake any quiz under 80% and review flashcards.</span>'}</div></div>`;
  }).join('');
  const review = weeks >= 2 ? `<div class="week review"><div class="week-label"><strong>Final week</strong>Exam week</div><div>
    <ul style="margin:0"><li>Take two full timed practice exams, at least two days apart.</li><li>Study the modules on your <a href="#weak">weak-area list</a>.</li><li>Review Module 19 (state rules) and Module 20 (exam strategy).</li><li>Confirm your test-center appointment, ID requirements and arrival time.</li></ul></div></div>` : '';
  out.innerHTML = head + `<div class="weeks" style="margin-top:12px">${html}${review}</div>`;
}

/* ===================== Events ===================== */
document.addEventListener('click', e => {
  const gl = e.target.closest('.gl'); if (gl) { showTerm(gl.dataset.term); return; }
  const b = e.target.closest('[data-act]'); if (!b) return;
  const a = b.dataset.act, k = b.dataset.k;
  const m = curMod && MOD(curMod);
  switch (a) {
    case 'modfilter': modFilter = k; viewModules(); break;
    case 'tab': modTab = k; $$('.tab').forEach(t => t.setAttribute('aria-selected', t.dataset.k === k)); renderTab(); if (b.classList.contains('btn')) window.scrollTo(0, 0); break;
    case 'markread': mp(curMod).read = true; save(); viewModule(curMod); updateSide(); break;
    case 'flip': fc.flipped = !fc.flipped; b.classList.toggle('flipped', fc.flipped); break;
    case 'fcknow': fcAdvance(true); break;
    case 'fcagain': fcAdvance(false); break;
    case 'fcprev': { fc.flipped = false; const n = fc.onlyNew ? fc.order.filter(i => !mp(curMod).known.includes(m.terms[i][0])).length : fc.order.length; fc.i = (fc.i - 1 + n) % n; renderCards(); break; }
    case 'fcshuffle': fc.order = shuffle(fc.order); fc.i = 0; fc.flipped = false; renderCards(); break;
    case 'fcnew': fc.onlyNew = !fc.onlyNew; fc.i = 0; fc.flipped = false; renderCards(); break;
    case 'qpick': {
      if (quiz.picks[quiz.i] !== undefined) break;
      const pick = +k; quiz.picks[quiz.i] = pick; record(curMod, quiz.i, pick === m.quiz[quiz.i][2]); save(); renderQuiz(); break;
    }
    case 'qnext':
      if (quiz.i + 1 < m.quiz.length) quiz.i++;
      else {
        quiz.done = true; const p = mp(curMod);
        const pct = Math.round(100 * quiz.picks.filter((pk, n) => pk === m.quiz[n][2]).length / m.quiz.length);
        p.attempts++; p.best = p.best === null ? pct : Math.max(p.best, pct); save(); updateSide();
        const pl = $('.mod-head .pill'); if (pl) pl.outerHTML = pill(status(curMod));
      }
      renderQuiz(); $('#tabBody').scrollIntoView({ block: 'start' }); break;
    case 'qretry': quiz = newQuiz(m); renderQuiz(); break;
    case 'calcex': { const c = CALCS.find(x => x.id === b.dataset.c); c.inputs.forEach(([kk, , d]) => { $(`#c-${c.id}-${kk}`).value = d; }); runCalc(c); break; }
    case 'examstart': S.run = buildExam(); showConfirm = false; save(); location.hash === '#exam' ? viewExam() : (location.hash = '#exam'); window.scrollTo(0, 0); break;
    case 'exampick': S.run.ans[S.run.cur] = +k; save(); renderExamRun(); break;
    case 'examnext': S.run.cur = Math.min(S.run.qs.length - 1, S.run.cur + 1); save(); renderExamRun(); break;
    case 'examprev': S.run.cur = Math.max(0, S.run.cur - 1); save(); renderExamRun(); break;
    case 'examgo': S.run.cur = +k; save(); renderExamRun(); break;
    case 'examflag': { const f = S.run.flags; const i = f.indexOf(S.run.cur); if (i >= 0) f.splice(i, 1); else f.push(S.run.cur); save(); renderExamRun(); break; }
    case 'examsubmitask': showConfirm = true; renderExamRun(); window.scrollTo(0, 0); break;
    case 'examcancel': showConfirm = false; renderExamRun(); break;
    case 'examsubmit': clearInterval(timerHandle); submitExam(); window.scrollTo(0, 0); break;
    case 'examreview': reviewFilter = 'missed'; renderExamResult(); break;
    case 'revfilter': reviewFilter = k; renderExamResult(); break;
  }
});
document.addEventListener('keydown', e => {
  if (!fc || modTab !== 'cards' || !$('.fc')) return;
  if (e.target.closest('input, select, textarea')) return;
  if (e.key === ' ' && !e.target.closest('button:not(.fc)')) { e.preventDefault(); $('.fc').click(); }
  else if (e.key === 'ArrowRight') fcAdvance(null);
  else if (e.key === 'ArrowLeft') $('[data-act="fcprev"]').click();
});

// If a timed exam ran out while the page was closed, score it on return.
if (S.run && examLeft() <= 0) submitExam();
route();
</script>
</body></html>
